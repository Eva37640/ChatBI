<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBI - 智能数据分析助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 头部 */
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .header-stats {
            display: flex;
            gap: 30px;
        }

        .header-stat {
            text-align: center;
        }

        .header-stat-value {
            font-size: 20px;
            font-weight: 700;
            color: #22c55e;
        }

        .header-stat-label {
            font-size: 12px;
            color: #999;
        }

        /* 主容器 */
        .main-container {
            flex: 1;
            display: flex;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px;
            gap: 20px;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .sidebar-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestion-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .suggestion-item {
            padding: 12px 15px;
            background: #f5f7fa;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            color: #555;
            border: 2px solid transparent;
        }

        .suggestion-item:hover {
            background: #f0fdf4;
            border-color: #22c55e;
            transform: translateX(5px);
        }

        .suggestion-item::before {
            content: "💡";
            margin-right: 8px;
        }

        .customer-list {
            margin-top: 25px;
        }

        .customer-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .customer-tag {
            padding: 6px 12px;
            background: linear-gradient(135deg, #22c55e20 0%, #16a34a20 100%);
            border-radius: 20px;
            font-size: 13px;
            color: #22c55e;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .customer-tag:hover {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            transform: scale(1.05);
        }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .welcome-message h2 {
            font-size: 28px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-message p {
            font-size: 16px;
            line-height: 1.6;
            max-width: 500px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .message.assistant .message-avatar {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        .message-content {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: #f5f7fa;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        /* 响应内容样式 */
        .response-content {
            width: 100%;
        }

        .query-text {
            font-weight: 600;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0e0e0;
            color: #22c55e;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #22c55e10 0%, #16a34a10 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #22c55e20;
        }

        .stat-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #22c55e;
        }

        .comparison-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .comparison-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .comparison-item {
            text-align: center;
        }

        .comparison-item .label {
            font-size: 13px;
            color: #999;
            display: block;
            margin-bottom: 5px;
        }

        .comparison-item .value {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .comparison-item.up .value {
            color: #22c55e;
        }

        .comparison-item.down .value {
            color: #ef4444;
        }

        .single-value-result {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #22c55e10 0%, #16a34a10 100%);
            border-radius: 12px;
            margin: 15px 0;
        }

        .value-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .value-number {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 14px;
        }

        .data-table th {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #f0f0f0;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .chart-container {
            margin: 20px 0;
            text-align: center;
        }

        .chart-container img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .detail-info {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }

        /* 输入区域 */
        .chat-input-container {
            padding: 20px 25px;
            background: #f8f9fa;
            border-top: 1px solid #e8e8e8;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            resize: none;
            min-height: 54px;
            max-height: 150px;
            font-family: inherit;
        }

        .chat-input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.1);
        }

        .send-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn.loading {
            pointer-events: none;
        }

        .send-btn.loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 加载动画 */
        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 20px;
            background: #f5f7fa;
            border-radius: 18px;
            color: #666;
            font-size: 14px;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            to { transform: translateY(-8px); }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .main-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .suggestion-list {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .suggestion-item {
                flex: 1;
                min-width: 200px;
            }
        }
    </style>
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div>
                <div class="logo-text">ChatBI</div>
                <div class="logo-subtitle">智能数据分析助手</div>
            </div>
        </div>
        <div class="header-stats">
            <div class="header-stat">
                <div class="header-stat-value" id="stat-orders">-</div>
                <div class="header-stat-label">总订单</div>
            </div>
            <div class="header-stat">
                <div class="header-stat-value" id="stat-customers">-</div>
                <div class="header-stat-label">客户数</div>
            </div>
            <div class="header-stat">
                <div class="header-stat-value" id="stat-products">-</div>
                <div class="header-stat-label">商品数</div>
            </div>
        </div>
    </header>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="suggestions">
                <div class="sidebar-title">
                    <span>💡</span>
                    <span>查询建议</span>
                </div>
                <div class="suggestion-list" id="suggestion-list">
                    <!-- 动态加载 -->
                </div>
            </div>

            <div class="customer-list">
                <div class="sidebar-title">
                    <span>👥</span>
                    <span>客户列表</span>
                </div>
                <div class="customer-tags" id="customer-tags">
                    <!-- 动态加载 -->
                </div>
            </div>
        </aside>

        <!-- 聊天区域 -->
        <main class="chat-container">
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-message">
                    <h2>👋 欢迎使用 ChatBI</h2>
                    <p>我是您的智能数据分析助手。您可以向我询问关于订单、客户、商品的任何问题，我会为您生成数据分析和可视化图表。</p>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-wrapper">
                    <textarea
                        class="chat-input"
                        id="chat-input"
                        placeholder="输入您的问题，例如：按客户统计订单数量"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="send-btn">
                        <span>发送</span>
                        <span>➤</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 全局变量
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const suggestionList = document.getElementById('suggestion-list');
        const customerTags = document.getElementById('customer-tags');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSuggestions();
            loadCustomers();
            loadStats();
        });

        // 加载建议
        async function loadSuggestions() {
            try {
                const response = await fetch('/api/suggestions');
                const data = await response.json();

                suggestionList.innerHTML = data.suggestions.map(s =>
                    `<div class="suggestion-item" onclick="setQuery('${s}')">${s}</div>`
                ).join('');
            } catch (error) {
                console.error('加载建议失败:', error);
            }
        }

        // 加载客户列表
        async function loadCustomers() {
            try {
                const response = await fetch('/api/customers');
                const data = await response.json();

                customerTags.innerHTML = data.customers.map(c =>
                    `<span class="customer-tag" onclick="setQuery('${c}的订单统计')">${c}</span>`
                ).join('');
            } catch (error) {
                console.error('加载客户失败:', error);
            }
        }

        // 加载统计数据
        async function loadStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('stat-orders').textContent = formatNumber(data.total_orders);
                document.getElementById('stat-customers').textContent = formatNumber(data.total_customers);
                document.getElementById('stat-products').textContent = formatNumber(data.total_products);
            } catch (error) {
                console.error('加载统计失败:', error);
            }
        }

        // 设置查询文本
        function setQuery(text) {
            chatInput.value = text;
            chatInput.focus();
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return num.toLocaleString();
        }

        // 添加消息
        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
                <div class="message-content">${content}</div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 添加加载指示器
        function addLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="loading-indicator">
                        <span>正在分析数据</span>
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 移除加载指示器
        function removeLoadingIndicator() {
            const loadingMessage = document.getElementById('loading-message');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        // 发送消息
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage(message, true);

            // 清空输入框
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // 添加加载指示器
            addLoadingIndicator();

            // 禁用发送按钮
            sendBtn.disabled = true;
            sendBtn.classList.add('loading');

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                // 移除加载指示器
                removeLoadingIndicator();

                if (data.success) {
                    // 添加助手回复
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant';
                    messageDiv.innerHTML = `
                        <div class="message-avatar">🤖</div>
                        <div class="message-content">${data.html}</div>
                    `;
                    chatMessages.appendChild(messageDiv);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                } else {
                    addMessage('抱歉，处理您的请求时出错了：' + data.error);
                }
            } catch (error) {
                removeLoadingIndicator();
                addMessage('抱歉，网络连接失败，请稍后重试。');
                console.error('发送消息失败:', error);
            } finally {
                sendBtn.disabled = false;
                sendBtn.classList.remove('loading');
            }
        }

        // 事件监听
        sendBtn.addEventListener('click', sendMessage);

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // 自动调整输入框高度
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
