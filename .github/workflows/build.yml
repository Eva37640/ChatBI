name: Build ChatBI for Windows and macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build EXE
      run: |
        pyinstaller --name=ChatBI-Windows --onefile --windowed --add-data="templates;templates" --add-data="data;data" --hidden-import=flask --hidden-import=pandas --hidden-import=numpy --hidden-import=openpyxl --hidden-import=matplotlib run.py
    
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatBI-Windows
        path: dist/ChatBI-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
    
    - name: Build macOS App
      run: |
        pyinstaller --name=ChatBI --windowed --add-data="templates:templates" --add-data="data:data" --hidden-import=flask --hidden-import=pandas --hidden-import=numpy --hidden-import=openpyxl --hidden-import=matplotlib run.py
    
    - name: Create DMG
      run: |
        brew install create-dmg
        create-dmg \
          --volname "ChatBI Installer" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --app-drop-link 600 185 \
          "ChatBI-macOS.dmg" \
          "dist/ChatBI.app"
    
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: ChatBI-macOS
        path: ChatBI-macOS.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: ChatBI-Windows
        path: ./release/
    
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: ChatBI-macOS
        path: ./release/
    
    - name: List files
      run: ls -la ./release/
    
    # 可选：自动创建 Release
    # - name: Create Release
    #   uses: softprops/action-gh-release@v1
    #   with:
    #     files: ./release/*
    #   env:
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
